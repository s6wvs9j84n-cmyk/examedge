<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamEdge — Sign In</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #2d2b55 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 420px;
    }
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 900;
      font-size: 20px;
      margin-bottom: 12px;
    }
    .logo-text {
      font-size: 26px;
      font-weight: 800;
      color: white;
      letter-spacing: -0.5px;
    }
    .logo-text span { color: #a29bfe; }
    .logo-sub {
      color: #b0aecb;
      font-size: 14px;
      margin-top: 4px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 36px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .tabs {
      display: flex;
      background: #f5f5f5;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 28px;
    }
    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: #888;
      transition: all 0.15s;
      border: none;
      background: none;
    }
    .tab.active {
      background: white;
      color: #6c5ce7;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e0e0f0;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      transition: border-color 0.15s;
      color: #222;
    }
    input:focus {
      outline: none;
      border-color: #6c5ce7;
      box-shadow: 0 0 0 3px rgba(108,92,231,0.08);
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #6c5ce7, #8b7cf6);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.15s;
      box-shadow: 0 4px 14px rgba(108,92,231,0.3);
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(108,92,231,0.4);
    }
    .btn:disabled {
      background: #ccc;
      box-shadow: none;
      transform: none;
      cursor: not-allowed;
    }
    .message {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      display: none;
    }
    .message.error {
      background: #fff0f0;
      color: #c0392b;
      border: 1px solid #ffc0c0;
    }
    .message.success {
      background: #f0fff4;
      color: #2d8a4e;
      border: 1px solid #c0f0d0;
    }
    .divider {
      text-align: center;
      color: #bbb;
      font-size: 13px;
      margin: 20px 0;
      position: relative;
    }
    .divider::before, .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 42%;
      height: 1px;
      background: #eee;
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }
    .terms {
      font-size: 12px;
      color: #aaa;
      text-align: center;
      margin-top: 16px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="logo">
    <div class="logo-icon">EE</div>
    <div class="logo-text">Exam<span>Edge</span></div>
    <div class="logo-sub">AI-powered GCSE revision</div>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab active" id="tab-login" onclick="switchTab('login')">Sign in</button>
      <button class="tab" id="tab-signup" onclick="switchTab('signup')">Create account</button>
    </div>

    <!-- Login form -->
    <div id="form-login">
      <div class="form-group">
        <label>Email address</label>
        <input type="email" id="login-email" placeholder="you@email.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="Your password">
      </div>
      <button class="btn" id="login-btn" onclick="handleLogin()">Sign in to ExamEdge</button>
      <div class="message" id="login-message"></div>
    </div>

    <!-- Signup form -->
    <div id="form-signup" style="display:none">
      <div class="form-group">
        <label>Full name</label>
        <input type="text" id="signup-name" placeholder="Your name">
      </div>
      <div class="form-group">
        <label>Email address</label>
        <input type="email" id="signup-email" placeholder="you@email.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signup-password" placeholder="At least 8 characters">
      </div>
      <button class="btn" id="signup-btn" onclick="handleSignup()">Create free account</button>
      <div class="message" id="signup-message"></div>
      <div class="terms">By signing up you agree to our Terms of Service and Privacy Policy</div>
    </div>
  </div>
</div>

<script>
  // ⚠️ REPLACE THESE WITH YOUR SUPABASE DETAILS
  const SUPABASE_URL = 'https://zxnicwzzlpfekzqwtrxt.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_y4RFImXWiWEZZ6HpXST9_w_LRvjOras';

  const { createClient } = supabase;
  const client = createClient(SUPABASE_URL, SUPABASE_KEY);

  // If already logged in, go straight to the app
  async function checkSession() {
    const { data: { session } } = await client.auth.getSession();
    if (session) window.location.href = 'index.html';
  }
  checkSession();

  function switchTab(tab) {
    document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('form-signup').style.display = tab === 'signup' ? 'block' : 'none';
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
  }

  function showMessage(id, text, type) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = `message ${type}`;
    el.style.display = 'block';
  }

  async function handleLogin() {
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    const btn = document.getElementById('login-btn');

    if (!email || !password) {
      showMessage('login-message', 'Please fill in all fields.', 'error');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Signing in...';

    const { error } = await client.auth.signInWithPassword({ email, password });

    if (error) {
      showMessage('login-message', error.message, 'error');
      btn.disabled = false;
      btn.textContent = 'Sign in to ExamEdge';
    } else {
      showMessage('login-message', 'Signed in! Redirecting...', 'success');
      setTimeout(() => window.location.href = 'index.html', 1000);
    }
  }

  async function handleSignup() {
    const name = document.getElementById('signup-name').value;
    const email = document.getElementById('signup-email').value;
    const password = document.getElementById('signup-password').value;
    const btn = document.getElementById('signup-btn');

    if (!name || !email || !password) {
      showMessage('signup-message', 'Please fill in all fields.', 'error');
      return;
    }

    if (password.length < 8) {
      showMessage('signup-message', 'Password must be at least 8 characters.', 'error');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Creating account...';

    const { error } = await client.auth.signUp({
      email,
      password,
      options: { data: { full_name: name } }
    });

    if (error) {
      showMessage('signup-message', error.message, 'error');
      btn.disabled = false;
      btn.textContent = 'Create free account';
    } else {
      showMessage('signup-message', '✅ Account created! Please check your email to confirm your account, then sign in.', 'success');
      btn.disabled = false;
      btn.textContent = 'Create free account';
    }
  }
</script>

</body>
</html>
